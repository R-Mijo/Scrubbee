[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubbee"
version = "0.2.1"
description = "Local privacy preparation with reversible placeholders and a loopback browser interface"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
classifiers = ["License :: Other/Proprietary License"]
authors = [{name = "Marco Armijo (R-Mijo)"}]
dependencies = []

[project.scripts]
scrubbee = "scrubbee.cli:main"

[tool.setuptools.packages.find]
include = ["scrubbee*"]

[tool.setuptools.package-data]
scrubbee = ["ui.html"]
