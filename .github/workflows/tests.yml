name: Tests and installation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m scrubbee demo
      - name: Install automatic English names on one integration runner
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install ".[names]"
          python -m spacy download en_core_web_sm
      - name: Verify real local name recognition
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m unittest discover -s tests -p test_names_integration.py -v
      - name: Import installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I -c "import scrubbee; print(scrubbee.__version__)"
